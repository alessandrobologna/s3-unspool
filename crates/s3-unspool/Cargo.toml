[package]
name = "s3-unspool"
version = "0.1.0-beta.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Fast streaming extraction of large ZIP archives from S3 into S3 prefixes with conditional writes."
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/s3-unspool"
keywords = ["aws", "s3", "zip", "archive", "deployment"]
categories = ["compression", "filesystem"]

[features]
default = ["zstd"]
zstd = ["async-compression/zstd", "async_zip/zstd"]

[dependencies]
async-compression.workspace = true
async_zip.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-types.workspace = true
bytes.workspace = true
crc32fast.workspace = true
fastrand.workspace = true
futures-lite.workspace = true
futures-util.workspace = true
hex.workspace = true
http-body.workspace = true
http-body-util.workspace = true
libc.workspace = true
md5.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
aws-config.workspace = true
