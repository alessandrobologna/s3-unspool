[project]
name = "s3-unspool-fixtures"
version = "0.1.0"
description = "Local fixture generation tools for s3-unspool benchmarks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
s3-unspool-generate-fixture = "s3_unspool_fixtures.generate:main"
s3-unspool-mutate-fixture = "s3_unspool_fixtures.mutate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_unspool_fixtures"]
