[workspace]
members = [
    "crates/s3-unspool",
    "crates/s3-unspool-cli",
    "tools/lambda-benchmark/lambda/s3-unspool-lambda",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Alessandro Bologna <alessandro.bologna@gmail.com>"]
license = "MIT"
repository = "https://github.com/alessandrobologna/s3-unspool"

[workspace.dependencies]
async-compression = { version = "0.4.42", default-features = false, features = ["tokio", "deflate"] }
async_zip = { version = "0.0.18", features = ["tokio", "tokio-fs", "deflate"] }
aws-config = "1.8.16"
aws-sdk-s3 = { version = "1.131.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-types = { version = "1.4.7", features = ["http-body-1-x"] }
bytes = "1.11.1"
clap = "4.6.1"
crc32fast = "1.5.0"
futures-lite = "2.6.1"
futures-util = "0.3.32"
fastrand = "2.4.1"
hex = "0.4.3"
http-body = "1.0.1"
http-body-util = "0.1.3"
ignore = "0.4.25"
lambda_runtime = "1.1.3"
libc = "0.2.186"
md5 = { package = "md-5", version = "0.11.0" }
s3-unspool = { path = "crates/s3-unspool", version = "=0.1.0-beta.3", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
terminal_size = "0.4.4"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

[profile.dist]
inherits = "release"
lto = "thin"
