name: s3-unspool CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/publish-s3-unspool.yml"
      - ".github/workflows/s3-unspool-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/s3-unspool/**"
      - "crates/s3-unspool-cli/**"
      - "dist-workspace.toml"
      - "rust-toolchain.toml"

permissions: {}

concurrency:
  group: s3-unspool-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default "$RUSTUP_TOOLCHAIN"
          rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run crate tests
        run: cargo test -p s3-unspool

      - name: Run CLI tests
        run: cargo test -p s3-unspool-cli

      - name: Run clippy
        run: cargo clippy -p s3-unspool --all-targets -- -D warnings

      - name: Run CLI clippy
        run: cargo clippy -p s3-unspool-cli --all-targets -- -D warnings

      - name: Build crate documentation
        run: cargo doc -p s3-unspool --no-deps

      - name: Verify crate package
        run: cargo package -p s3-unspool

      - name: Verify CLI package manifest
        run: cargo package -p s3-unspool-cli --list
