[project]
name = "s3-unspool-lambda-benchmark"
version = "0.1.0"
description = "Local Lambda benchmark harness for s3-unspool"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "matplotlib",
]

[project.scripts]
s3-unspool-benchmark = "s3_unspool_benchmark.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_unspool_benchmark"]
